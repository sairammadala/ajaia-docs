services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ajaia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajaia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ajaia}
    ports:
      # Published so `npm run dev` / `npm test` on the host can reach it.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ajaia}:${POSTGRES_PASSWORD:-ajaia_dev_password}@db:5432/${POSTGRES_DB:-ajaia}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-0123456789}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
