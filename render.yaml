# Render Blueprint: creates the web app (built from the Dockerfile) and a
# free Postgres database, and wires them together.
# On startup scripts/start.sh applies migrations and seeds the demo accounts.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: ajaia-db
    plan: free
    region: virginia
    databaseName: ajaia
    user: ajaia
